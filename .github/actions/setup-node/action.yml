name: Setup Node
description: "Setups node and configures the cache"

inputs:
  NODEJS_VERSION:
    required: true
    description: "NodeJS version to install"

runs:
  using: "composite"
  steps:
    # Must run before actions/setup-node, which needs pnpm on the PATH to
    # locate the store for its cache. The version comes from the
    # packageManager field in package.json.
    - name: Set up pnpm
      uses: pnpm/action-setup@v6.0.10

    - name: Get cypress version
      id: cypress-version
      run: echo "cyver=$(jq -r '.devDependencies.cypress' package.json)" >> $GITHUB_OUTPUT
      working-directory: frontend/
      shell: bash

    - name: Cache cypress binaries
      uses: actions/cache@v6.1.0
      id: cypress-cache
      with:
        path: /home/runner/.cache/cypress
        key: cypress-${{ runner.os }}-${{ steps.cypress-version.outputs.cyver }}
        restore-keys: |
          cypress-${{ runner.os }}-${{ steps.cypress-version.outputs.cyver }}

    - name: Set up NodeJS
      uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ inputs.NODEJS_VERSION }}
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      working-directory: .
      shell: bash
      env:
        CYPRESS_CACHE_FOLDER: /home/runner/.cache/cypress
