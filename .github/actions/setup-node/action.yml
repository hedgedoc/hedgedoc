name: Setup Node
description: "Setups node and configures the cache"

inputs:
  NODEJS_VERSION:
    required: true
    description: "NodeJS version to install"

runs:
  using: "composite"
  steps:
    # The pnpm version comes from the packageManager field in package.json.
    # cache: true caches the pnpm store, keyed on the hash of pnpm-lock.yaml,
    # and prunes it in the post step so it does not grow without bound.
    - name: Set up pnpm
      uses: pnpm/action-setup@v6.0.10
      with:
        cache: true

    - name: Get cypress version
      id: cypress-version
      run: echo "cyver=$(jq -r '.devDependencies.cypress' package.json)" >> $GITHUB_OUTPUT
      working-directory: frontend/
      shell: bash

    - name: Cache cypress binaries
      uses: actions/cache@v6.1.0
      id: cypress-cache
      with:
        path: /home/runner/.cache/cypress
        key: cypress-${{ runner.os }}-${{ steps.cypress-version.outputs.cyver }}
        restore-keys: |
          cypress-${{ runner.os }}-${{ steps.cypress-version.outputs.cyver }}

    - name: Set up NodeJS
      uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ inputs.NODEJS_VERSION }}
        # The pnpm store is cached by pnpm/action-setup above.
        package-manager-cache: false

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      working-directory: .
      shell: bash
      env:
        CYPRESS_CACHE_FOLDER: /home/runner/.cache/cypress
