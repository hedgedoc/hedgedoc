packages:
  - backend
  - frontend
  - commons
  - database
  - dev-reverse-proxy
  - docs
  - html-to-react
  - markdown-it-plugins

# Reproduce the flat node_modules layout we had under Yarn's node-modules linker.
# Several things depend on it: the typeRoots in commons/database, the
# ../node_modules/.bin/* script paths and the COPY node_modules step in
# backend/docker/Dockerfile.
nodeLinker: hoisted

# pnpm 11 defaults this to 1440 minutes. Yarn had npmMinimalAgeGate: 0.
minimumReleaseAge: 0

overrides:
  "@types/node": 24.10.7
  domhandler: 6.0.1
  "@codemirror/state": 6.7.1
  "@codemirror/autocomplete": 6.20.3
  "@codemirror/view": 6.43.9
  "@codemirror/language": 6.12.4
  "@codemirror/commands": 6.11.0
  "@codemirror/lang-markdown": 6.5.2
  "@codemirror/language-data": 6.5.2
  "@codemirror/lint": 6.9.7
  "@codemirror/theme-one-dark": 6.1.3
  "@lezer/common": 1.5.2
  "@types/react": 18.3.27

patchedDependencies:
  eventemitter2@6.4.9: patches/eventemitter2@6.4.9.patch
  yjs@13.6.32: patches/yjs@13.6.32.patch
  vega-canvas@1.2.7: patches/vega-canvas@1.2.7.patch

allowBuilds:
  # Produce real build artefacts (native bindings, downloaded binaries).
  "@parcel/watcher": true
  # Ships prebuilds for every platform (incl. linuxmusl-x64 for the Alpine
  # images); building from source would need Python, which those images lack.
  better-sqlite3: false
  cypress: true
  esbuild: true
  unrs-resolver: true
  # Donation banners and analytics beacons only, no artefacts. Yarn ran these
  # because enableScripts applied to everything; there is no reason to.
  "@nestjs/core": false
  "@scarf/scarf": false
  es5-ext: false
